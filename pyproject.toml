[tool.ruff]
line-length = 110
target-version = "py311"

[tool.ruff.lint]
ignore = [
    "E501",   # line length (formatter's job, not lint's)
    "B008",   # FastAPI's Depends(...)-as-default is the framework's own idiom
    "BLE001", # a couple of intentional catch-all error boundaries (LLM call, legacy endpoint)
    "TRY002", # plain Exception is fine for this project's size; no custom hierarchy needed
]

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]
